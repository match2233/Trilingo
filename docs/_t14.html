<!DOCTYPE html><html><head><meta charset="utf-8"><title>T14</title>
<style>body{font:13px/1.6 monospace;white-space:pre-wrap;padding:10px}iframe{width:420px;height:800px}</style>
</head><body><div id="out">…</div><div id="host"></div>
<script>
const L=[];const p=(c,m,x)=>L.push((c?'OK   ':'FAIL ')+m+(x!==undefined?'   ['+x+']':''));
const s=ms=>new Promise(r=>setTimeout(r,ms));
window.onerror=(m,src,l)=>{L.push('ERR  '+m+' @'+l);};
(async()=>{
  const results={};
  ['L01-S1-1','L01-S1-2','L01-S1-3','L01-S2-1','L01-S3-1'].forEach(q=>{results[q]=true;});
  results['L01-S1-4']=false;
  const st={v:1,updated:'',words:{en:[],jp:[]},edits:{},
    base:{stats:{},mistakes:{},days:[],done:{},dropped:{},folded_ts:0,folded:{}},
    events:[],life:{ledger:[],deer:{}},minna:{},fav:{}};
  st.minna['1']={status:'done',section:0,idx:0,seconds:215,score:5,total:40,
    updated_at:'2026-10-24T10:00:00',results};
  st.fav['L01-S1-1']={note:'学生 がくせい',at:'2026-10-24T10:00:00'};
  st.fav['L01-S3-2']={note:'',at:'2026-10-24T10:00:01'};
  localStorage.setItem('trilingo.state', JSON.stringify(st));
  const f=document.createElement('iframe'); f.id='f'; f.src='index.html';
  document.getElementById('host').appendChild(f);
  f.onload=async()=>{
   try{
    const d=f.contentDocument,$=id=>d.getElementById(id),q=s=>Array.from(d.querySelectorAll(s));
    await s(2000);
    const raw=JSON.parse(f.contentWindow.localStorage.getItem('trilingo.state')||'{}');
    p(Object.keys(raw.fav||{}).length===2,'存储里 fav 有 2 条',Object.keys(raw.fav||{}).length);
    p(/共 2 题/.test($('tileFav').querySelector('[data-foot]').textContent),'首页显示收藏数',
      $('tileFav').querySelector('[data-foot]').textContent);
    $('tileFav').click(); await s(400);
    p(q('#favList .fav-card').length===2,'收藏夹列出 2 题',q('#favList .fav-card').length);
    p(/学生 がくせい/.test($('favList').textContent),'笔记显示出来');
    $('favList').querySelector('.fav-del').click(); await s(200);
    p(q('#favList .fav-card').length===1,'取消收藏生效',q('#favList .fav-card').length);
    $('favBack').click(); await s(200);
    $('minnaBack').click(); await s(300);
    $('tileMinna').click(); await s(400);
    q('#minnaList .minna-row')[0].click(); await s(800);
    p(!!d.querySelector('.paper-sec'),'直接进试卷');
    p(!!d.querySelector('.paper-fill .paper-cell'),'填空网格排版',
      d.querySelectorAll('.paper-fill .paper-cell').length);
    p(!!d.querySelector('.paper-line'),'其它题型逐行');
    p(!/答案/.test($('mtBody').textContent),'不出现「答案」二字');
    p(!!d.querySelector('.pstar'),'试卷有星标');
    p(!!d.querySelector('.bad'),'错题标红');
   }catch(e){L.push('EXC '+(e&&e.message?e.message:e));}
   document.getElementById('out').textContent=L.join('\n')+'\n==END==';
   document.title='DONE';
  };
})();
</script></body></html>
