<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover 让内容延伸到刘海区域, 配合 CSS 里的 safe-area 内边距 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Trilingo</title>

<!-- iOS 添加到主屏幕后以独立应用方式运行 (隐藏 Safari 地址栏) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilingo">
<meta name="theme-color" content="#e8622c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============================== 首页 ============================== -->
  <section id="home" class="view active">
    <div class="streak card">
      <div>
        <div class="lbl">已连续打卡</div>
        <div class="num" id="streakNum">0 天</div>
      </div>
    </div>
    <p class="sub" id="syncNote" style="margin:-8px 0 12px 2px"></p>

    <div class="grid2">
      <div class="tile en card" id="tileEn">
        <div class="t">英语词汇</div><div class="d"></div>
      </div>
      <div class="tile err card" id="tileErrEn">
        <div class="t">错题本</div><div class="d"></div>
      </div>
      <div class="tile en card" id="tileJp">
        <div class="t">日语词汇</div><div class="d"></div>
      </div>
      <div class="tile err card" id="tileErrJp">
        <div class="t">错题本</div><div class="d"></div>
      </div>
    </div>
  </section>

  <!-- ============================== 测验 ============================== -->
  <section id="quiz" class="view">
    <div class="quiz-head">
      <button class="back" id="backBtn">← 返回</button>
      <span class="title" id="quizTitle"></span>
    </div>
    <div class="bar"><i id="bar"></i></div>

    <div class="quiz-body">
      <div class="badge" id="badge"></div>
      <div class="meaning" id="meaning"></div>

      <div>
        <input type="text" id="answer" enterkeyhint="done" autocomplete="off"
               autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="输入后按回车">
        <button class="primary" id="submitBtn" style="width:100%;margin-top:10px">提交</button>
      </div>

      <div class="result" id="result"></div>

      <div style="display:flex;justify-content:flex-end">
        <button class="primary" id="nextBtn" style="display:none">下一个 ›</button>
      </div>
    </div>
  </section>

  <!-- ============================== 错题本 ============================== -->
  <section id="mistakes" class="view">
    <h1>错题本</h1>
    <div class="seg">
      <button data-lang="en" class="on">英语</button>
      <button data-lang="jp">日语</button>
    </div>
    <p class="sub">出错当天记为 day0，此后 day+1、+3、+7、+15、+30 会再次出现。</p>
    <div class="list" id="mistakeList"></div>
  </section>

  <!-- ============================== 数据库 ============================== -->
  <section id="database" class="view">
    <h1>数据库</h1>
    <div class="seg">
      <button data-lang="en" class="on">英语</button>
      <button data-lang="jp">日语</button>
    </div>
    <input type="search" id="search" placeholder="搜索单词或释义" style="font-size:16px;text-align:left;margin-bottom:6px">
    <p class="sub" id="dbCount"></p>
    <div class="list" id="dbList"></div>
  </section>

  <!-- ============================== 设置 ============================== -->
  <section id="settings" class="view">
    <h1>同步设置</h1>
    <p class="sub">学习数据存放在一个 GitHub 私有仓库里，两台设备各自拉取、合并、回传。</p>

    <h2>访问令牌</h2>
    <input type="password" id="token" placeholder="github_pat_..." autocomplete="off" autocapitalize="none">
    <h2>用户名</h2>
    <input type="text" id="owner" placeholder="match2233" autocomplete="off" autocapitalize="none">
    <h2>数据仓库</h2>
    <input type="text" id="repo" placeholder="Trilingo-data" autocomplete="off" autocapitalize="none">

    <div class="btn-row">
      <button id="saveCfg">保存</button>
      <button id="testBtn">测试连接</button>
    </div>
    <div class="btn-row">
      <button class="primary" id="syncBtn">立即同步</button>
    </div>
    <p class="sub" id="syncMsg" style="margin-top:10px"></p>

    <h2>当前数据</h2>
    <p class="sub" id="stats"></p>

    <h2>安装到主屏幕</h2>
    <p class="sub">在 Safari 中打开本页 → 点底部分享按钮 → 选择「添加到主屏幕」。
      之后从主屏幕启动就会像原生应用一样全屏运行，断网也能背单词。</p>
  </section>

</div>

<!-- ============================== 底部导航 ============================== -->
<nav id="tabs">
  <button data-view="home" class="on"><span class="ic">🏠</span>首页</button>
  <button data-view="mistakes"><span class="ic">📕</span>错题本</button>
  <button data-view="database"><span class="ic">📚</span>数据库</button>
  <button data-view="settings"><span class="ic">⚙️</span>同步</button>
</nav>

<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
